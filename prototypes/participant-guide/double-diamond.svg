<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" role="img" aria-label="Widen, then narrow, twice: first to pick the problem, then the solution" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="760" height="404" fill="#ffffff"/>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#1f1f1f">Widen, then narrow, twice: first to pick the problem, then the solution</text>
  <text x="200" y="70" text-anchor="middle" font-weight="600" fill="#1f1f1f">Choose the right problem</text>
  <text x="560" y="70" text-anchor="middle" font-weight="600" fill="#1f1f1f">Build the right thing</text>

  <!-- First diamond (accent) -->
  <polygon points="24,160 200,88 376,160 200,232" fill="#2b6fd6" fill-opacity="0.12" stroke="#2b6fd6" stroke-width="2"/>
  <line x1="200" y1="92" x2="200" y2="228" stroke="#2b6fd6" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="112" y="158" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1f1f">Discover</text>
  <text x="112" y="174" text-anchor="middle" font-size="11.5" fill="#5f5f5f">Widen out</text>
  <text x="288" y="158" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1f1f">Define</text>
  <text x="288" y="174" text-anchor="middle" font-size="11.5" fill="#5f5f5f">Narrow down</text>

  <!-- Second diamond -->
  <polygon points="384,160 560,88 736,160 560,232" fill="none" stroke="#b5b2a8" stroke-width="1.25"/>
  <line x1="560" y1="92" x2="560" y2="228" stroke="#b5b2a8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="472" y="158" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1f1f">Develop</text>
  <text x="472" y="174" text-anchor="middle" font-size="11.5" fill="#5f5f5f">Widen out</text>
  <text x="648" y="158" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1f1f">Deliver</text>
  <text x="648" y="174" text-anchor="middle" font-size="11.5" fill="#5f5f5f">Narrow down</text>

  <!-- Connectors and boxes -->
  <g stroke="#b5b2a8" fill="none">
    <line x1="112" y1="197" x2="112" y2="256" stroke-width="1"/>
    <line x1="288" y1="197" x2="288" y2="256" stroke-width="1"/>
    <line x1="472" y1="197" x2="472" y2="256" stroke-width="1"/>
    <line x1="648" y1="197" x2="648" y2="256" stroke-width="1"/>
    <rect x="30" y="256" width="164" height="124" rx="8" stroke-width="1.25"/>
    <rect x="206" y="256" width="164" height="124" rx="8" stroke-width="1.25"/>
    <rect x="390" y="256" width="164" height="124" rx="8" stroke-width="1.25"/>
    <rect x="566" y="256" width="164" height="124" rx="8" stroke-width="1.25"/>
  </g>

  <!-- Discover -->
  <text x="42" y="280" font-weight="600" fill="#1f1f1f">Steps 1–3</text>
  <text x="42" y="300" font-size="11.5" fill="#1f1f1f">Dig into the history,</text>
  <text x="42" y="316" font-size="11.5" fill="#1f1f1f">map the players</text>
  <text x="42" y="336" font-size="11.5" fill="#5f5f5f">Field survey</text>
  <text x="42" y="352" font-size="11.5" fill="#5f5f5f">Sensemaking Sprint</text>
  <text x="42" y="368" font-size="11.5" fill="#5f5f5f">Triangulator</text>

  <!-- Define -->
  <text x="218" y="280" font-weight="600" fill="#1f1f1f">Steps 4–6</text>
  <text x="218" y="300" font-size="11.5" fill="#1f1f1f">Find themes, name</text>
  <text x="218" y="316" font-size="11.5" fill="#1f1f1f">what's stuck, reframe</text>
  <text x="218" y="336" font-size="11.5" fill="#5f5f5f">Meet the Pod</text>
  <text x="218" y="352" font-size="11.5" fill="#5f5f5f">Pods form</text>
  <text x="218" y="368" font-size="11.5" fill="#5f5f5f">Frame assignment</text>

  <!-- Develop -->
  <text x="402" y="280" font-weight="600" fill="#1f1f1f">Step 7</text>
  <text x="402" y="300" font-size="11.5" fill="#1f1f1f">Prototype and test</text>
  <text x="402" y="316" font-size="11.5" fill="#1f1f1f">with real people</text>
  <text x="402" y="336" font-size="11.5" fill="#5f5f5f">Hackathon probes</text>
  <text x="402" y="352" font-size="11.5" fill="#5f5f5f">Field testing</text>
  <text x="402" y="368" font-size="11.5" fill="#5f5f5f">Build and iterate</text>

  <!-- Deliver -->
  <text x="578" y="280" font-weight="600" fill="#1f1f1f">Steps 8–9</text>
  <text x="578" y="300" font-size="11.5" fill="#1f1f1f">Plan the change,</text>
  <text x="578" y="316" font-size="11.5" fill="#1f1f1f">hand on lessons</text>
  <text x="578" y="336" font-size="11.5" fill="#5f5f5f">Find a problem owner</text>
  <text x="578" y="352" font-size="11.5" fill="#5f5f5f">Showcase</text>
  <text x="578" y="368" font-size="11.5" fill="#5f5f5f">Open-source handoff</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
